name: pocmovieai

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movie_search}
      POSTGRES_USER: ${POSTGRES_USER:-movie_search}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movie_search_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - movie-search-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__MovieDatabase: >-
        Host=database;Port=5432;Database=${POSTGRES_DB:-movie_search};Username=${POSTGRES_USER:-movie_search};Password=${POSTGRES_PASSWORD:-movie_search_local}
      Database__ApplyMigrations: "true"
      Cors__AllowedOrigins__0: http://localhost:${APP_PORT:-8080}
      Cors__AllowedOrigins__1: http://127.0.0.1:${APP_PORT:-8080}
    ports:
      - "127.0.0.1:${API_PORT:-5045}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 10
    restart: unless-stopped
    init: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    restart: unless-stopped
    init: true

volumes:
  movie-search-data: